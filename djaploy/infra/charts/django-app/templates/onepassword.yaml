{{- $root := . -}}
{{- $items := dict -}}
{{- range $name, $ref := .Values.onePassword.env }}
{{- $_ := set $items (include "django-app.opItem" $ref) true }}
{{- end }}
{{- range $item, $_ := $items }}
---
# Synced from 1Password; the app reads the fields it needs via onePassword.env.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "django-app.opSecretName" (dict "root" $root "item" $item) }}
  labels:
    {{- include "django-app.labels" $root | nindent 4 }}
spec:
  itemPath: {{ printf "vaults/%s/items/%s" $root.Values.onePassword.vault $item | quote }}
{{- end }}
{{- with .Values.onePassword.pullSecretItem }}
---
# GHCR pull secret (item field ".dockerconfigjson").
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-pull
  labels:
    {{- include "django-app.labels" $root | nindent 4 }}
type: kubernetes.io/dockerconfigjson
spec:
  itemPath: {{ printf "vaults/%s/items/%s" $root.Values.onePassword.vault . | quote }}
{{- end }}
